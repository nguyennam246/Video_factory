<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<!-- phim2d.html — VIDEO HƯỚNG DẪN đủ 20 cảnh theo MẪU 2 (BOSS duyệt 23/10 khuya: 2D biên tập nền kem + nhân vật dẫn chuyện).
     Lời: loi_v7.txt · lời loi_v9.txt + hình bản 13 (BOSS 24/10: C15 thiên nga đen gom 3 bẫy không ai thấy trước; C12 SCS bỏ số ước "−48 % lãi", chỉ nêu sự thật 80 % sản lượng là hàng quốc tế) · bản 12 (BOSS 24/10: thêm C15a2 DGC lãnh đạo bị khởi tố; PNJ thành ví dụ thứ ba) · hình bản 11 (BOSS 24/10: Bước 2 vẽ lại = cọc 100 triệu chia 20 cục 5 triệu bay vào 20 ô mã) · bản 10 (BOSS 24/10: giữ nhân vật gốc, chỉ lúc gặp bẫy thay bằng ảnh GPT Sol vẽ đúng nét cũ, mặt "Tiếng thét" — nv_sol/nv_thet.png) · bản 8 (BOSS 24/10: gặp bẫy = 2 tay ôm 2 má, miệng tròn chữ O như tranh "Tiếng thét" Munch, thay khoanh tay) · bản 7: BOSS 24/10: bỏ ví dụ HWS — chỉ bị cảnh báo, không có nguy cơ rời sàn; logo góc phải = dungladu.vn, bỏ good deal; nhân vật 2 tay đổi tư thế theo biểu cảm; "1 tỷ 742 triệu") · bản 6: BOSS 24/10: chân trang dungladu.vn + cảnh cuối C21; C06a SWC, C06b CDN; C15c "chia trứng vào nhiều rổ"; C16 bỏ "18 dấu hiệu" → C16a 1 trang đủ các loại bẫy) · bản 5: BOSS 24/10: vẽ lại xe máy C07 + máy bay C12; thêm C15a Covid, C15b PNJ, C15c chia nhỏ rủi ro) · bản 4: BOSS 24/10: ẩn dụ "của rẻ là của ôi" thay "phô mai trong bẫy chuột"; hình cá ôi trên sạp chợ) · NHIP (nhip.json, mốc từng chữ) + HOP (anh/hop.json) bơm qua quay3d.py (TRANG=phim2d.html).
     Hẹn giờ: Web Animations dừng sẵn, máy quay đặt currentTime = t; vòng lặp nhỏ (thở, chớp mắt) tính trong ve(t).
     window.SU_KIEN = mốc tiếng động (am_thanh.py đọc su_kien.json do quay3d.py ghi). -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--kem:#FBF5EA;--kem2:#F3EADB;--than:#1F2A37;--mo:#6B7280;--xanh:#0E6B53;--ngoc:#DDF1EA;--san:#F0654A;--mu:#F3B43F;--xam:#C9D6E3;--da:#F2C9A0}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--kem);font-family:"Be Vietnam Pro",sans-serif;color:var(--than)}
.cham{position:absolute;inset:0;background-image:radial-gradient(rgba(14,107,83,.10) 3px,transparent 3px);background-size:48px 48px}
.logo{position:absolute;right:60px;top:56px;font-weight:900;font-size:30px;z-index:8}.logo b{color:var(--xanh)}
.canh{position:absolute;inset:0;display:none}
svg *{transform-box:fill-box}
.tieu{position:absolute;left:80px;right:80px;top:170px;z-index:3}
.tieu h1{margin:0;font-size:76px;line-height:1.05;font-weight:900;letter-spacing:-1.5px}
.dong{display:block;overflow:hidden;padding-bottom:4px}.dong > span{display:inline-block}
.chip{display:inline-block;font-size:30px;font-weight:800;letter-spacing:2px;padding:12px 26px;border-radius:999px;background:var(--san);color:#fff}
.chip.xanh{background:var(--xanh)}.chip.xam{background:#6B7A8C}
.v{color:var(--san)}.x{color:var(--xanh)}.m{color:var(--mo)}
.phude{position:absolute;left:70px;right:70px;bottom:150px;text-align:center;font-size:50px;font-weight:800;line-height:1.3;z-index:8}
.tien-do{position:absolute;left:80px;right:80px;bottom:80px;height:8px;border-radius:8px;background:rgba(31,42,55,.08);z-index:8}
.tien-do i{display:block;height:100%;width:0;border-radius:8px;background:var(--xanh)}
.the{position:absolute;background:#fff;border-radius:34px;box-shadow:0 2px 0 rgba(0,0,0,.04),0 34px 60px -30px rgba(31,42,55,.35);padding:30px 36px}
.to{font-size:64px;font-weight:900;letter-spacing:-1px;line-height:1.08}
.vua{font-size:44px;font-weight:800;line-height:1.2}
.nho{font-size:30px;font-weight:800;letter-spacing:2px;color:var(--mo)}
.giay{position:absolute;left:70px;width:940px;top:520px;height:760px;background:#fff;border-radius:34px;overflow:hidden;z-index:2;
  box-shadow:0 2px 0 rgba(0,0,0,.04),0 40px 80px -30px rgba(31,42,55,.35)}
.giay .dau-giay{position:relative;z-index:2;height:96px;background:var(--kem2);display:flex;align-items:center;gap:16px;padding:0 34px;font-size:30px;font-weight:800;color:var(--mo)}
.giay .dau-giay b{color:var(--than)}
.giay .ruot{position:absolute;left:0;right:0;top:96px;bottom:0;overflow:hidden}
.giay .camera{position:absolute;left:0;top:0;transform-origin:0 0}
.giay img{position:absolute;left:0;top:0}
.dq{position:absolute;background:#FFE066;mix-blend-mode:multiply;border-radius:14px 26px 18px 30px;transform-origin:left center}
.nhan{position:absolute;padding:26px 34px 30px;background:var(--mu);border-radius:10px;box-shadow:0 24px 40px -18px rgba(120,80,0,.55);text-align:center;z-index:5;max-width:470px}
.nhan.xam{background:var(--xam);box-shadow:0 24px 40px -18px rgba(40,60,90,.45)}
.nhan small{display:block;font-size:26px;font-weight:800;letter-spacing:4px;color:rgba(31,42,55,.7)}
.nhan b{display:block;font-size:54px;font-weight:900;line-height:1.05}
.nhan:before{content:"";position:absolute;left:50%;top:-16px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:var(--san);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.huy{position:absolute;width:270px;height:270px;border-radius:50%;background:var(--san);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  box-shadow:0 30px 50px -20px rgba(240,101,74,.7);z-index:5}
.huy b{font-size:80px;font-weight:900;letter-spacing:-3px;line-height:1}.huy small{font-size:22px;font-weight:800;margin-top:8px;padding:0 26px;line-height:1.15}
.bong{position:absolute;background:#fff;border-radius:40px;padding:22px 32px;font-size:44px;font-weight:900;box-shadow:0 20px 40px -20px rgba(31,42,55,.35);z-index:6;white-space:nowrap}
.bong:after{content:"";position:absolute;left:60px;bottom:-22px;border:16px solid transparent;border-top:24px solid #fff}
.dau{position:absolute;font-size:46px;font-weight:900;color:var(--san);border:7px solid var(--san);border-radius:16px;padding:8px 22px;background:rgba(251,245,234,.92);z-index:6}
.web{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:32px;font-weight:800;letter-spacing:1px;color:var(--xanh);z-index:8}
.man{position:absolute;inset:0;background:var(--xanh);z-index:20;transform:translateX(-100%)}
.vong{position:absolute;border-radius:50%;background:var(--ngoc)}
.hang{display:flex;align-items:center;gap:24px}
</style></head><body>
<div class="logo">dungladu<b>.vn</b></div>
<div id="san"></div>
<div class="phude" id="phude"></div>
<div class="tien-do"><i id="td"></i></div>
<div class="man" id="man"></div>
<img src="nv_sol/nv_thet.png" style="display:none" alt=""><img src="nv_sol/thien_nga.png" style="display:none" alt="">

<script>
const NHIP = window.NHIP, HOP = window.HOP;
const DS = Object.keys(NHIP).sort(); const BD = {}; let T0 = 0;
for (const c of DS) { BD[c] = T0; T0 += NHIP[c].dai; }
window.TONG = T0;
const $ = id => document.getElementById(id);
const NAY = 'cubic-bezier(.2,.9,.3,1.25)', MUOT = 'cubic-bezier(.45,0,.2,1)', RA = 'cubic-bezier(.15,.8,.3,1)', DAP = 'cubic-bezier(.3,1.5,.5,1)';
const SU_KIEN = []; window.SU_KIEN = SU_KIEN;
const daCo = new Set();
function a(el, kf, t, d, ease = NAY) { el = typeof el === 'string' ? $(el) : el; if (!el) { console.error('thiếu', kf); return; }
  const fill = daCo.has(el) ? 'forwards' : 'both'; daCo.add(el);
  el.animate(kf, {delay: Math.max(0, t) * 1000, duration: d * 1000, fill, easing: ease}); }
const vao = (el, t, tu = 'translateY(60px)', d = .6) => a(el, [{opacity: 0, transform: tu}, {opacity: 1, transform: 'none'}], t, d);
const pop = (el, t, d = .5) => a(el, [{opacity: 0, transform: 'scale(.3)'}, {opacity: 1, transform: 'scale(1)'}], t, d);
const hien = (el, t, d = .2) => a(el, [{opacity: 0}, {opacity: 1}], t, d, 'linear');
const an = (el, t, d = .2) => a(el, [{opacity: 1}, {opacity: 0}], t, d, 'linear');
const dongVao = (el, t) => vao(el, t, 'translateY(110%)', .65);

// ---------- nhân vật ----------
// tư thế tay (khung 300×560, vai ~84/216,388): chi = 1 tay giơ trình bày · cheo = 2 tay bắt chéo chữ X (không, tránh)
// nghi = tay chống cằm, tay kia đỡ khuỷu · ngac = 2 tay giơ hai bên mặt · theo bảng tư thế chuẩn của nhân vật hoạt hình giải thích
const TU_THE = {
  chi: ['M84 388 Q60 452 68 516', 'M216 388 Q270 372 288 316'],
  cheo: ['M84 388 L114 468 L222 402', 'M216 388 L186 468 L78 402'],
  om: ['M84 388 L36 326 L76 262', 'M216 388 L264 326 L224 262'],  // gặp bẫy: ôm 2 má (tranh Tiếng thét)
  nghi: ['M84 388 L100 462 L224 468', 'M216 388 L240 458 L176 306'],
  ngac: ['M84 388 L42 322 L56 250', 'M216 388 L258 322 L244 250'],
};
const TAY_THEO = {cuoi: 'chi', ngac: 'ngac', lo: 'om', nghi: 'nghi'}, TAYNV = {};
function doiTay(id, kieu, t) { const cu = TAYNV[id] || 'chi'; if (cu === kieu) return; TAYNV[id] = kieu; an(`${id}_tay_${cu}`, t, .12); hien(`${id}_tay_${kieu}`, t, .12); }
function NV(id, x, y, w, them = '') {
  return `<svg id="${id}" class="nv" style="position:absolute;left:${x}px;top:${y}px;z-index:4;${them}" width="${w}" height="${w * 560 / 300}" viewBox="0 0 300 560">
   <g class="nv-than" id="${id}_than" style="transform-origin:150px 560px">
    <path d="M60 560 L70 380 Q75 330 150 330 Q225 330 230 380 L240 560 Z" fill="#0E6B53"/>
    <path d="M128 330 L150 372 L172 330 Z" fill="#FBF5EA"/>
    <rect x="128" y="290" width="44" height="50" rx="16" fill="#E8B88A"/>
    <g class="nv-dau" style="transform-origin:150px 300px">
     <circle cx="150" cy="220" r="92" fill="#F2C9A0"/>
     <path d="M58 210 Q60 120 150 118 Q245 120 244 205 Q230 160 190 150 Q150 175 90 168 Q70 185 58 210Z" fill="#26313D"/>
     <g class="nv-mat" style="transform-origin:150px 224px"><circle cx="118" cy="226" r="11" fill="#1F2A37"/><circle cx="184" cy="226" r="11" fill="#1F2A37"/>
      <circle cx="121" cy="222" r="3.5" fill="#fff"/><circle cx="187" cy="222" r="3.5" fill="#fff"/></g>
     <g id="${id}_may_cuoi"><path d="M100 198 Q118 190 134 196 M168 196 Q184 190 202 198" stroke="#1F2A37" stroke-width="7" stroke-linecap="round" fill="none"/></g>
     <g id="${id}_may_ngac" opacity="0"><path d="M100 186 Q118 172 134 182 M168 182 Q184 172 202 186" stroke="#1F2A37" stroke-width="7" stroke-linecap="round" fill="none"/></g>
     <g id="${id}_may_lo" opacity="0"><path d="M102 192 Q118 196 134 186 M168 186 Q184 196 200 192" stroke="#1F2A37" stroke-width="7" stroke-linecap="round" fill="none"/></g>
     <g id="${id}_may_nghi" opacity="0"><path d="M100 196 Q118 190 134 196 M168 186 Q184 178 202 186" stroke="#1F2A37" stroke-width="7" stroke-linecap="round" fill="none"/></g>
     <path id="${id}_mieng_cuoi" d="M134 262 Q151 278 168 262" stroke="#B5544A" stroke-width="7" stroke-linecap="round" fill="none"/>
     <ellipse id="${id}_mieng_ngac" cx="151" cy="268" rx="16" ry="14" fill="#B5544A" opacity="0"/>
     <ellipse id="${id}_mieng_lo" cx="151" cy="274" rx="13" ry="21" fill="#7A2E28" stroke="#B5544A" stroke-width="4" opacity="0"/>
     <path id="${id}_mieng_nghi" d="M138 268 L166 264" stroke="#B5544A" stroke-width="7" stroke-linecap="round" fill="none" opacity="0"/>
     <circle cx="96" cy="258" r="14" fill="#F0654A" opacity=".25"/><circle cx="206" cy="258" r="14" fill="#F0654A" opacity=".25"/>
     <path id="${id}_moHoi" d="M240 150 Q252 172 240 182 Q228 172 240 150Z" fill="#7CC4E8" opacity="0"/>
     </g>
    ${Object.entries(TU_THE).map(([k, ds]) => `<g id="${id}_tay_${k}" opacity="${k === 'chi' ? 1 : 0}">${ds.map(d => { const m = d.match(/(-?[\d.]+) (-?[\d.]+)$/);
      return `<path d="${d}" stroke="#F2C9A0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/><ellipse cx="${m[1]}" cy="${m[2]}" rx="20" ry="26" fill="#F2C9A0" stroke="#D9A57A" stroke-width="3"/>`; }).join('')}</g>`).join('')}
    </g>
    <g id="${id}_thetG" opacity="0"><image href="nv_sol/nv_thet.png" x="11.54" y="30.12" width="277.23" height="517.32"/></g></svg>`;
}
const NET = {};
function bieuCam(id, kieu, t) { const cu = NET[id] || 'cuoi'; if (cu === kieu) return; NET[id] = kieu;
  for (const p of ['may', 'mieng']) { an(`${id}_${p}_${cu}`, t, .08); hien(`${id}_${p}_${kieu}`, t, .08); }
  if (kieu === 'lo') { an(`${id}_than`, t, .08); hien(`${id}_thetG`, t, .08);  // ảnh Sol: mặt Tiếng thét
    $(`${id}_thetG`).animate([0, -7, 6, -6, 5, -4, 3, 0].map(x => ({transform: `translateX(${x}px)`})), {delay: t * 1000, duration: 700, fill: 'none', easing: 'linear'}); }
  if (cu === 'lo') { hien(`${id}_than`, t, .08); an(`${id}_thetG`, t, .08); }
  doiTay(id, TAY_THEO[kieu], t); }
const tay = (id, tu, den, t) => doiTay(id, 'chi', t);  // 2 tay: thay xoay 1 cánh tay bằng tư thế trình bày
function bong(san, chu, x, y, t, tat) { const id = 'b' + Math.random().toString(36).slice(2, 8);
  san.insertAdjacentHTML('beforeend', `<div class="bong" id="${id}" style="left:${x}px;top:${y}px;opacity:0">${chu}</div>`);
  a(id, [{opacity: 0, transform: 'scale(.4) translateY(30px)'}, {opacity: 1, transform: 'none'}], t, .45); if (tat) an(id, tat, .25); }

// ---------- khung cảnh ----------
function canh(c, html) { const s = document.createElement('section'); s.className = 'canh'; s.id = 'S' + c;
  s.innerHTML = `<div class="cham"></div>` + html; $('san').appendChild(s); const T = (k, o = 0) => BD[c] + NHIP[c].cau[k].bd + o; return {s, T, bd: BD[c], het: BD[c] + NHIP[c].dai}; }
let soMan = 0;
function quet(t) { const id = 'man' + (++soMan); document.body.insertAdjacentHTML('beforeend', `<div class="man" id="${id}"></div>`);
  a(id, [{transform: 'translateX(-100%)'}, {transform: 'translateX(0)', offset: .45}, {transform: 'translateX(0)', offset: .55}, {transform: 'translateX(100%)'}], t - .45, .9, MUOT);
  SU_KIEN.push({t: t - .5, loai: 'vut'}); }
function tieuDe(c, k, dong1, dong2, chip, chipLop = '', top = 170) {
  const p = c.s.id; c.s.insertAdjacentHTML('beforeend', `<div class="tieu" style="top:${top}px">${chip ? `<span class="chip ${chipLop}" id="${p}chip">${chip}</span>` : ''}
   <h1 style="margin-top:${chip ? 26 : 0}px"><span class="dong"><span id="${p}d1">${dong1}</span></span>${dong2 ? `<span class="dong"><span id="${p}d2">${dong2}</span></span>` : ''}</h1></div>`);
  const t = c.T(k, .2); if (chip) pop(p + 'chip', t, .45); dongVao(p + 'd1', t + .15); if (dong2) dongVao(p + 'd2', t + .35); }

// tờ báo cáo thật: cấu hình cảnh
function baoCao(c, o) {
  const p = c.s.id, h = HOP[o.anh], [IW, IH] = h.anh, [hx, hy, hw, hh] = h.hop_px, f = o.tieuDiem || h.hop_px;
  const GW = 940, GH = 664;
  c.s.insertAdjacentHTML('beforeend', `<div class="giay" id="${p}giay" style="opacity:0"><div class="dau-giay"><b>Báo cáo bát cơm</b> · ${o.ma}</div>
    <div class="ruot"><div class="camera" id="${p}cam"><img src="anh/${o.anh}.png" width="${IW}" height="${IH}"><div class="dq" id="${p}dq" style="left:${hx - 16}px;top:${hy - 10}px;width:${hw + 32}px;height:${hh + 20}px"></div></div></div></div>`);
  const kep = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const kh = (s, lechY) => { const x = kep(GW / 2 - (f[0] + f[2] / 2) * s, GW - IW * s, 0); return `translate(${x}px, ${GH * lechY - (f[1] + f[3] / 2) * s}px) scale(${s})`; };
  const s1 = o.s1 || Math.min(.95, 780 / f[2]), s0 = o.s0 || Math.max(GW / IW, s1 * .78);
  const tg = o.tGiay;
  a(p + 'giay', [{opacity: 0, transform: 'translateY(240px) rotate(4deg)'}, {opacity: 1, transform: 'rotate(-1.6deg)'}], tg, .8);
  a(p + 'cam', [{transform: kh(s0, .6)}, {transform: kh(s0, .6)}], 0, .1, 'linear');
  a(p + 'cam', [{transform: kh(s0, .6)}, {transform: kh(s1, .5)}], o.tZoom, 1.4, MUOT);
  a(p + 'dq', [{transform: 'scaleX(0)'}, {transform: 'scaleX(1)'}], o.tDq, 1.0, 'ease-out');
  if (o.huy) { c.s.insertAdjacentHTML('beforeend', `<div class="huy" id="${p}huy" style="right:60px;top:${o.huyTop || 1180}px;${o.huy.mau ? 'background:' + o.huy.mau : ''}"><b id="${p}so" style="${o.huy.so.length > 5 ? 'font-size:58px' : ''}">${o.huy.so}</b><small>${o.huy.nhan}</small></div>`);
    pop(p + 'huy', o.tHuy, .55); if (o.huy.dem) { DEM.push({id: p + 'so', t: o.tHuy + .2, ...o.huy.dem}); SU_KIEN.push({t: o.tHuy + .2, loai: 'dem'}); } }
  c.s.insertAdjacentHTML('beforeend', `<div class="nhan ${o.co ? 'xam' : ''}" id="${p}nhan" style="left:90px;top:1210px;opacity:0"><small>${o.co ? 'DẤU HIỆU · BẠN TỰ CÂN' : 'NHÃN BẪY'}</small><b>${o.nhan}</b></div>`);
  a(p + 'nhan', [{opacity: 0, transform: 'scale(1.7) rotate(-10deg)'}, {opacity: 1, transform: 'scale(1) rotate(4deg)'}], o.tNhan, .28, DAP);
  a(p + 'giay', [{transform: 'rotate(-1.6deg)'}, {transform: 'rotate(-1.6deg) translateY(10px)'}, {transform: 'rotate(-1.6deg)'}], o.tNhan, .25, 'linear');
  SU_KIEN.push({t: o.tNhan, loai: 'dap'});
  if (o.nv !== false) { c.s.insertAdjacentHTML('beforeend', NV(p + 'nv', 640, 1340, 170)); vao(p + 'nv', o.tNv || o.tNhan - .8, 'translateY(320px)', .6);
    bieuCam(p + 'nv', o.co ? 'nghi' : 'lo', (o.tNv || o.tNhan - .8) + .3); }
  return {an: t => an(p + 'giay', t, .3)};
}
const DEM = [];

// ---------- hình vẽ dùng lại ----------
const BAY = (id, x, y, w) => `<svg id="${id}" style="position:absolute;left:${x}px;top:${y}px" width="${w}" height="${w * .78}" viewBox="60 120 1000 780">
  <ellipse cx="560" cy="720" rx="420" ry="46" fill="rgba(31,42,55,.12)"/>
  <path d="M150 560 L870 560 L960 660 L240 660 Z" fill="#F0BE7E"/><path d="M240 660 L960 660 L960 700 Q960 712 948 712 L252 712 Q240 712 240 700 Z" fill="#C98D4E"/>
  <path d="M150 560 L240 660 L240 712 L150 612 Z" fill="#B57B40"/>
  <g stroke="#D9A160" stroke-width="5" stroke-linecap="round" opacity=".7"><path d="M220 590 Q480 600 820 586"/><path d="M260 625 Q560 632 900 622"/><path d="M300 645 Q520 650 760 642"/></g>
  <path d="M560 612 L760 612 L790 640 L590 640 Z" fill="#AEB8C4"/>
  <g id="${id}thanh"><path d="M200 600 L200 520 Q200 500 220 500 L480 500 Q500 500 500 520 L500 610" fill="none" stroke="#8A96A3" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/></g>

  const tu = x0.tu.map(([a, d, s]) => ({a, d, s}));
  for (const [doc, ma] of DOC) { const n = doc.split(' ').length;
    for (let i = 0; i + n <= tu.length; i++) if (tu.slice(i, i + n).map(x => x.s.replace(/[.,:?!]/g, '')).join(' ') === doc) {
      const cuoi = tu[i + n - 1].s.match(/[.,:?!]$/); tu.splice(i, n, {a: tu[i].a, d: tu[i + n - 1].a + tu[i + n - 1].d - tu[i].a, s: ma + (cuoi ? cuoi[0] : '')}); } }
  const lc = l - x0.bd; el.style.fontSize = tu.length > 20 ? '42px' : tu.length > 14 ? '46px' : '50px';
  el.innerHTML = tu.map(x => `<span style="color:${lc >= x.a + x.d ? '#1F2A37' : lc >= x.a - .03 ? '#F0654A' : 'rgba(31,42,55,.28)'}">${x.s}</span>`).join(' ');
}

const CANH_EL = DS.map(c => ({c, el: $('S' + c)}));
let truoc = null;
window.ve = function (t) {
  let dang = CANH_EL[CANH_EL.length - 1];
  for (const x of CANH_EL) if (t >= BD[x.c] && t < BD[x.c] + NHIP[x.c].dai) { dang = x; break; }
  if (dang !== truoc) { for (const x of CANH_EL) x.el.style.display = x === dang ? 'block' : 'none'; truoc = dang; }
  for (const an_ of document.getAnimations()) { an_.pause(); an_.currentTime = t * 1000; }
  dang.el.querySelectorAll('.nv').forEach((n, i) => {
    n.querySelector('.nv-than').style.transform = `scaleY(${1 + Math.sin(t * 2.4 + i) * .012})`;
    const ph = (t + i * 1.7) % 3.7; n.querySelector('.nv-mat').style.transform = ph < .13 ? 'scaleY(.1)' : 'none';
    n.querySelector('.nv-dau').style.transform = `rotate(${Math.sin(t * 1.3 + i) * 2.5}deg)`; });
  for (const d of DEM) { const el = $(d.id); if (!el) continue; const k = Math.max(0, Math.min(1, (t - d.t) / 1.1));
    el.textContent = d.tien + Math.round(d.so * (1 - Math.pow(1 - k, 3))) + d.sau; }
  phuDe(t);
};
(async () => { await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => 0))); window.ve(0); window.SAN_SANG = true; })();
